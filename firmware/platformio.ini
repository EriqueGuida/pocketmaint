; PlatformIO Project Configuration File for M5Stack CardPuter ADV
; PocketMaint - Terminal Portatil de Manutencao Industrial

[env:m5stack-cardputer]
platform = espressif32
board = m5stack-cardputer
framework = arduino

; Velocidades de upload e comunicacao serial
monitor_speed = 115200
upload_speed = 1500000

; Porta serial detectada no Windows (COM5)
upload_port = COM5
monitor_port = COM5

; Particionamento de memoria Flash (permite aplicacoes de ate 3 MB)
board_build.partitions = huge_app.csv

; Flags de compilacao para ESP32-S3 com USB CDC serial ativo
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; Bibliotecas oficiais do ecossistema M5Stack e utilitarios
lib_deps =
    m5stack/M5Cardputer@^1.0.3
    m5stack/M5Unified@^0.2.1
    m5stack/M5GFX@^0.2.0
    bblanchon/ArduinoJson@^7.2.1
